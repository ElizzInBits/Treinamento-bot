<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Empresas</title>
  <link rel="icon" type="image/png" href="../home/Imagens/logo.png" />
  <link rel="stylesheet" href="/empreCadastro/css/empre-style.css" />
  <link rel="stylesheet" href="/empreCadastro/style-enhancements.css" />
</head>
<body style="background: linear-gradient(135deg, #0f4c5c 0%, #6ec6ca 100%); min-height: 100vh; margin: 0; padding: 20px; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center;">
  <div class="container" style="max-width: 500px; width: 100%; background: white; border-radius: 24px; box-shadow: 0 25px 50px rgba(0,0,0,0.15); animation: slideUp 0.8s ease-out;">
    <div class="header" style="padding: 48px 48px 32px 48px; text-align: center; background: white; border-radius: 24px 24px 0 0;">
      <div style="margin-bottom: 32px;">
        <img src="../home/Imagens/logo2.png" alt="Logo" style="height: 90px; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.1));" />
      </div>
      <h1 style="color: #374151; font-size: 32px; font-weight: 700; margin: 0 0 12px 0; letter-spacing: -0.5px;">Cadastro de Empresa</h1>
      <p style="color: #718096; font-size: 16px; margin: 0; font-weight: 400; line-height: 1.5;">Preencha os dados da empresa para começar</p>
    </div>

    <div class="form-section" style="padding: 40px; background: white; border-radius: 0 0 24px 24px;">
      <form id="cadastroEmpresaForm">
        <div class="form-group" style="margin-bottom: 24px;">
          <label for="razaoSocial" style="color: #374151; font-weight: 600; margin-bottom: 8px; display: block; font-size: 14px;">🏢 Razão Social *</label>
          <input type="text" id="razaoSocial" name="razaoSocial" required placeholder="Ex: Tech Solutions Ltda" style="width: 100%; padding: 16px 20px; border: 2px solid #e5e7eb; border-radius: 12px; font-size: 16px; transition: all 0.3s ease; box-sizing: border-box; background: #fafafa;" />
        </div>

        <div class="form-group" style="margin-bottom: 24px;">
          <label for="cnpj" style="color: #374151; font-weight: 600; margin-bottom: 8px; display: block; font-size: 14px;">🆔 CNPJ *</label>
          <input type="text" id="cnpj" name="cnpj" required placeholder="00.000.000/0000-00" style="width: 100%; padding: 16px 20px; border: 2px solid #e5e7eb; border-radius: 12px; font-size: 16px; transition: all 0.3s ease; box-sizing: border-box; background: #fafafa;" />
        </div>

        <div class="form-group" style="margin-bottom: 24px;">
          <label for="porte" style="color: #374151; font-weight: 600; margin-bottom: 8px; display: block; font-size: 14px;">📈 Porte da Empresa *</label>
          <select id="porte" name="porte" required style="width: 100%; padding: 16px 20px; border: 2px solid #e5e7eb; border-radius: 12px; font-size: 16px; transition: all 0.3s ease; box-sizing: border-box; background: #fafafa;">
            <option value="">Selecione o porte</option>
            <option value="micro">Microempresa</option>
            <option value="pequeno">Pequeno Porte</option>
            <option value="medio">Médio Porte</option>
            <option value="grande">Grande Porte</option>
          </select>
        </div>

        <div class="form-group" style="margin-bottom: 24px;">
          <label for="endereco" style="color: #374151; font-weight: 600; margin-bottom: 8px; display: block; font-size: 14px;">📍 Endereço *</label>
          <input type="text" id="endereco" name="endereco" required placeholder="Rua, número e complemento" style="width: 100%; padding: 16px 20px; border: 2px solid #e5e7eb; border-radius: 12px; font-size: 16px; transition: all 0.3s ease; box-sizing: border-box; background: #fafafa;" />
        </div>

        <div class="form-group" style="margin-bottom: 24px;">
          <label for="cep" style="color: #374151; font-weight: 600; margin-bottom: 8px; display: block; font-size: 14px;">📮 CEP *</label>
          <input type="text" id="cep" name="cep" required placeholder="00000-000" style="width: 100%; padding: 16px 20px; border: 2px solid #e5e7eb; border-radius: 12px; font-size: 16px; transition: all 0.3s ease; box-sizing: border-box; background: #fafafa;" />
        </div>

        <div class="form-group" style="margin-bottom: 24px;">
          <label for="contato" style="color: #374151; font-weight: 600; margin-bottom: 8px; display: block; font-size: 14px;">📱 Número de Contato *</label>
          <div style="display: flex; gap: 12px;">
            <select id="ddi" name="ddi" required style="width: 120px; padding: 16px 12px; border: 2px solid #e5e7eb; border-radius: 12px; font-size: 16px; transition: all 0.3s ease; background: #fafafa;">
              <option value="+55">🇧🇷 +55</option>
              <option value="+1">🇺🇸 +1</option>
              <option value="+44">🇬🇧 +44</option>
              <option value="+33">🇫🇷 +33</option>
              <option value="+49">🇩🇪 +49</option>
              <option value="+34">🇪🇸 +34</option>
              <option value="+351">🇵🇹 +351</option>
              <option value="+52">🇲🇽 +52</option>
              <option value="+81">🇯🇵 +81</option>
              <option value="+91">🇮🇳 +91</option>
              <option value="+61">🇦🇺 +61</option>
              <option value="+1">🇨🇦 +1</option>
            </select>
            <input type="text" id="contato" name="contato" required placeholder="(11) 99999-9999" style="flex: 1; padding: 16px 20px; border: 2px solid #e5e7eb; border-radius: 12px; font-size: 16px; transition: all 0.3s ease; background: #fafafa;" />
          </div>
          <small style="color: #9ca3af; font-size: 12px; margin-top: 6px; display: block;">Digite apenas números, sem parênteses ou traços</small>
        </div>

        <div class="form-group" style="margin-bottom: 32px;">
          <label for="email" style="color: #374151; font-weight: 600; margin-bottom: 8px; display: block; font-size: 14px;">✉️ Email *</label>
          <input type="email" id="email" name="email" required placeholder="contato@empresa.com" style="width: 100%; padding: 16px 20px; border: 2px solid #e5e7eb; border-radius: 12px; font-size: 16px; transition: all 0.3s ease; box-sizing: border-box; background: #fafafa;" />
        </div>

        <button type="submit" class="btn-primary" style="background: linear-gradient(135deg, #0f4c5c 0%, #128c7e 100%); color: white; border: none; padding: 18px 32px; font-size: 16px; font-weight: 600; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 12px; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 8px 25px rgba(15, 76, 92, 0.25); width: 100%; margin-top: 8px; letter-spacing: 0.5px;">
          <span style="font-size: 18px;">✓</span> Cadastrar Empresa
        </button>
      </form>
    </div>

    <!-- Seção de Gerenciamento de Treinamentos -->
    <div class="training-management-section" id="trainingSection" style="display: none; padding: 40px; background: white; border-top: 1px solid #e5e7eb;">
      <h2 style="color: #374151; font-size: 24px; font-weight: 600; margin: 0 0 30px 0; text-align: center; display: flex; align-items: center; justify-content: center; gap: 10px;"><span style="font-size: 28px;">🎓</span> Gerenciar Treinamentos</h2>
      
      <div class="training-container">
        <!-- Treinamentos Atribuídos -->
        <div class="training-column assigned-trainings">
          <h3>📝 Treinamentos Atribuídos</h3>
          <div class="training-list" id="assignedTrainingsList">
            <div class="loading">Carregando...</div>
          </div>
        </div>

        <!-- Treinamentos Disponíveis -->
        <div class="training-column available-trainings">
          <h3>➕ Treinamentos Disponíveis</h3>
          <div class="training-list" id="availableTrainingsList">
            <div class="loading">Carregando...</div>
          </div>
        </div>
      </div>
    </div>


  </div>

  <script src="/empreCadastro/js/empre-script.js" defer></script>
</body>
</html>

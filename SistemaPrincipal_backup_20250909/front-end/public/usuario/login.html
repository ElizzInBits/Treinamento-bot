<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso aos Meus Dados</title>
    <link rel="icon" type="image/png" href="../home/Imagens/logo.png">
</head>
<body style="background: linear-gradient(135deg, #0f4c5c 0%, #6ec6ca 100%); min-height: 100vh; margin: 0; padding: 20px; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; display: flex; justify-content: center; align-items: center;">
    <div class="container" style="max-width: 400px; width: 100%; background: white; border-radius: 24px; box-shadow: 0 25px 50px rgba(0,0,0,0.15);">
        <div class="header" style="padding: 48px 48px 32px 48px; text-align: center;">
            <img src="../home/Imagens/logo2.png" alt="Logo" style="height: 80px; margin-bottom: 24px;">
            <h1 style="color: #374151; font-size: 28px; font-weight: 700; margin: 0 0 12px 0;">Meus Dados</h1>
            <p style="color: #718096; font-size: 14px; margin: 0;">Digite seu email e CPF para acessar</p>
        </div>

        <div class="form-section" style="padding: 0 48px 48px 48px;">
            <form id="loginForm">
                <div style="margin-bottom: 20px;">
                    <label style="color: #374151; font-weight: 600; margin-bottom: 8px; display: block; font-size: 14px;">✉️ E-mail</label>
                    <input type="email" id="email" required placeholder="seu.email@exemplo.com" style="width: 100%; padding: 16px 20px; border: 2px solid #e5e7eb; border-radius: 12px; font-size: 16px; box-sizing: border-box; background: #fafafa;">
                </div>

                <div style="margin-bottom: 32px;">
                    <label style="color: #374151; font-weight: 600; margin-bottom: 8px; display: block; font-size: 14px;">🆔 CPF</label>
                    <input type="text" id="cpf" required placeholder="000.000.000-00" maxlength="14" style="width: 100%; padding: 16px 20px; border: 2px solid #e5e7eb; border-radius: 12px; font-size: 16px; box-sizing: border-box; background: #fafafa;">
                </div>

                <button type="submit" style="background: linear-gradient(135deg, #0f4c5c 0%, #128c7e 100%); color: white; border: none; padding: 16px 32px; font-size: 16px; font-weight: 600; border-radius: 12px; cursor: pointer; width: 100%; transition: all 0.3s ease;">
                    🔍 Acessar Meus Dados
                </button>
            </form>

            <div style="text-align: center; margin-top: 24px;">
                <button onclick="window.location.href='/autoCadastro'" style="background: transparent; color: #6b7280; border: none; font-size: 14px; cursor: pointer; text-decoration: underline;">
                    ← Voltar ao Cadastro
                </button>
            </div>
        </div>
    </div>

    <script>
        // Máscara para CPF
        document.getElementById('cpf').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            value = value.replace(/(\d{3})(\d)/, '$1.$2');
            value = value.replace(/(\d{3})(\d)/, '$1.$2');
            value = value.replace(/(\d{3})(\d{1,2})$/, '$1-$2');
            e.target.value = value;
        });

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value;
            const cpf = document.getElementById('cpf').value.replace(/\D/g, '');
            
            try {
                const response = await fetch('/api/usuario/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, cpf })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    localStorage.setItem('userData', JSON.stringify(data.usuario));
                    window.location.href = '/usuario-painel';
                } else {
                    alert('Dados não encontrados. Verifique seu email e CPF.');
                }
            } catch (error) {
                alert('Erro ao acessar dados. Tente novamente.');
            }
        });
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Empresas</title>
  <link rel="icon" type="image/png" href="../home/Imagens/logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
    rel="stylesheet">
  <script src="https://kit.fontawesome.com/4392b60e4c.js" crossorigin="anonymous"></script>
  <link rel="stylesheet" href="/cadastro-empresa/css/cadastro-empresa.css" />
</head>

<body>
  <div class="container-header">
    <div class="header">
      <img src="../home/Imagens/logo-treinamentos.png" alt="Logo" />
    </div>
  </div>
  <div class="container">
    <h1>Cadastro de Empresa</h1>
    <p class="subtitle">Preencha os dados da empresa para começar</p>

    <div class="form-section">
      <form id="cadastroEmpresaForm">

        <div class="form-group">
          <label for="razaoSocial">Razão Social <span class="required">*</span></label>
          <div class="input-wrapper">
            <div class="input-icon">
              <span><i class="fa-solid fa-building"></i></span>
            </div>
            <input type="text" id="razaoSocial" name="razaoSocial" placeholder="Ex: Tech Solutions Ltda" required/>
          </div> 
        </div>

        <div class="form-group">
          <label for="cnpj">CNPJ <span class="required">*</span></label>
          <div class="input-wrapper">
            <div class="input-icon">
              <span><i class="fa-solid fa-id-card"></i></span>
            </div>
            <input type="text" id="cnpj" name="cnpj" placeholder="00.000.000/0000-00" required/>
          </div>
        </div>

        <div class="form-group">
          <label for="porte">Porte da Empresa <span class="required">*</span></label>
          <div class="input-wrapper">
            <div class="input-icon">
              <i class="fa-solid fa-users"></i>
            </div>
            <select id="porte" name="porte" required>
              <option value="">Selecione o porte...</option>
              <option value="MICRO">Microempresa</option>
              <option value="PEQUENO">Pequeno Porte</option>
              <option value="MEDIO">Médio Porte</option>
              <option value="GRANDE">Grande Porte</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="endereco">Endereço <span class="required">*</span></label>
          <div class="input-wrapper">
            <div class="input-icon">
              <span><i class="fa-solid fa-map-location-dot"></i></span>
            </div>
            <input type="text" id="endereco" name="endereco" placeholder="Rua, número e complemento" required/>
          </div>
        </div>

        <div class="form-group">
          <label for="cep">CEP <span class="required">*</span></label>
          <div class="input-wrapper">
            <div class="input-icon">
              <span><i class="fa-solid fa-inbox"></i></span>
            </div>
            <input type="text" id="cep" name="cep" placeholder="00000-000" required/>
          </div>
        </div>

        <div class="form-group">
          <label for="contato">Número de Contato <span class="required">*</span></label>

          <div class="input-wrapper">
            <div class="input-icon-ddi">
              <select id="ddi" name="ddi" required>
                <option value="+55">🇧🇷 +55</option>
                <option value="+1">🇺🇸 +1</option>
                <option value="+44">🇬🇧 +44</option>
                <option value="+33">🇫🇷 +33</option>
                <option value="+49">🇩🇪 +49</option>
                <option value="+39">🇮🇹 +39</option>
                <option value="+34">🇪🇸 +34</option>
                <option value="+351">🇵🇹 +351</option>
                <option value="+54">🇦🇷 +54</option>
                <option value="+56">🇨🇱 +56</option>
                <option value="+57">🇨🇴 +57</option>
                <option value="+51">🇵🇪 +51</option>
                <option value="+598">🇺🇾 +598</option>
                <option value="+595">🇵🇾 +595</option>
                <option value="+591">🇧🇴 +591</option>
                <option value="+593">🇪🇨 +593</option>
                <option value="+58">🇻🇪 +58</option>
                <option value="+52">🇲🇽 +52</option>
                <option value="+506">🇨🇷 +506</option>
                <option value="+507">🇵🇦 +507</option>
                <option value="+503">🇸🇻 +503</option>
                <option value="+502">🇬🇹 +502</option>
                <option value="+504">🇭🇳 +504</option>
                <option value="+505">🇳🇮 +505</option>
                <option value="+1">🇨🇦 +1</option>
                <option value="+81">🇯🇵 +81</option>
                <option value="+86">🇨🇳 +86</option>
                <option value="+82">🇰🇷 +82</option>
                <option value="+91">🇮🇳 +91</option>
                <option value="+61">🇦🇺 +61</option>
                <option value="+64">🇳🇿 +64</option>
                <option value="+27">🇿🇦 +27</option>
                <option value="+20">🇪🇬 +20</option>
                <option value="+7">🇷🇺 +7</option>
                <option value="+380">🇺🇦 +380</option>
                <option value="+48">🇵🇱 +48</option>
                <option value="+31">🇳🇱 +31</option>
                <option value="+32">🇧🇪 +32</option>
                <option value="+41">🇨🇭 +41</option>
                <option value="+43">🇦🇹 +43</option>
                <option value="+45">🇩🇰 +45</option>
                <option value="+46">🇸🇪 +46</option>
                <option value="+47">🇳🇴 +47</option>
                <option value="+358">🇫🇮 +358</option>
              </select>
            </div>
            <input type="text" id="contato" name="contato" placeholder="(11) 99999-9999" required/>
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email <span class="required">*</span></label>
          <div class="input-wrapper">
            <div class="input-icon">
              <span><i class="fa-solid fa-envelope"></i></span>
            </div>
            <input type="email" id="email" name="email" placeholder="contato@empresa.com" required/>
          </div>
        </div>

        <div class="form-group">
          <label>Horário de Funcionamento</label>

          <div class="input-row">
            <div class="input-wrapper">
              <input type="time" id="horaInicio" name="horaInicio"/>
            </div>

            <span><i class="fa-solid fa-arrow-right"></i></span>

            <div class="input-wrapper">
              <input type="time" id="horaFim" name="horaFim"/>
            </div>
          </div>

          <small style="color: #9ca3af; font-size: 12px; margin-top: 6px; display: block;">Deixe vazio para atendimento
            24 horas</small>
        </div>

        <div class="form-group">
          <div class="input-row">
            <label for="senha">Senha de Acesso <span class="required">*</span></label>
            <button type="button" id="gerarSenha" class="btn-gerar">
              🎲 Gerar
            </button>
          </div>

          <div class="input-wrapper">
            <div class="input-icon">
              <span><i class="fa-solid fa-envelope"></i></span>
            </div>
            <input type="text" id="senha" name="senha" placeholder="Digite ou gere uma senha" required/>
          </div>
          <small style="color: #9ca3af; font-size: 12px; margin-top: 6px; display: block;">Mínimo 8 caracteres. Use o
            botão "Gerar" para criar uma senha forte
          </small>
        </div>

        <hr style="border: none; border-top: 1px solid #D1D1D1; width: 100%; margin-top: 30px; margin-bottom: 30px;">

        <div class="btn-cadastro">
          <button type="submit">
            <span><i class="fa-solid fa-user-check" style="margin-right: 5px"></i>Finalizar Cadastro</span>
          </button>
        </div>
      </form>
    </div>

        </div>
      </div>
    </div>

  </div>

  <script src="/cadastro-empresa/js/cadastro-empresa.js" defer></script>
</body>

</html>

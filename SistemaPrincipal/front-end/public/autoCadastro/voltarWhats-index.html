    <link rel="stylesheet" href="css/voltarWhats-style.css">

</head>
<body>
    <div class="container">
        <div class="success-icon">✅</div>

        </div>

            Clique no botão acima para retornar ao WhatsApp<br>

        </div>
    </div>

</html>

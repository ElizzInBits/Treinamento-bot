<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Dados</title>
    <link rel="icon" type="image/png" href="../home/Imagens/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Onest:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <script src="https://kit.fontawesome.com/4392b60e4c.js" crossorigin="anonymous"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="../login-usuario/css/editar-usuario.css">
</head>

<body>
    <div class="container">
        <div class="header">
            <h1 id="pageTitle">Meus Dados</h1>
            <hr style="border: none; border-top: 1px solid #E5E7EB; width: 100%;">
        </div>

        <div class="content">
            <div id="viewMode">
                <div class="data-grid">
                    <div class="data-item">
                        <label>
                            <i class="fa-solid fa-user"></i>
                            Nome Completo
                        </label>
                        <p id="viewNome">-</p>
                    </div>

                    <div class="data-item">
                        <label>
                            <i class="fa-solid fa-id-card"></i>
                            CPF
                        </label>
                        <p id="viewCpf">-</p>
                    </div>

                    <div class="data-item">
                        <label>
                            <i class="fa-solid fa-envelope"></i>
                            E-mail
                        </label>
                        <p id="viewEmail">-</p>
                    </div>

                    <div class="data-item">
                        <label>
                            <i class="fa-solid fa-phone"></i>
                            Telefone
                        </label>
                        <p id="viewTelefone">-</p>
                    </div>

                    <div class="data-item">
                        <label>
                            <i class="fa-solid fa-building"></i>
                            Empresa
                        </label>
                        <p id="viewEmpresa">-</p>
                    </div>
                </div>

                <hr style="border: none; border-top: 1px solid #E5E7EB; width: 100%; margin-top: 30px;">

                <div class="btn-wrapper">
                    <button onclick="toggleEditMode()">
                        <i class="fa-solid fa-pen-to-square"></i>
                        Editar Dados
                    </button>
                    <button onclick="window.location.href='/autoCadastro'">
                        <i class="fa-solid fa-arrow-left-long"></i>
                        Voltar
                    </button>
                </div>
            </div>

            <div id="editMode">
                <form id="editForm">
                    <div class="data-grid">
                        <div class="data-item-edit">
                            <label>
                                <i class="fa-solid fa-user"></i>
                                Nome Completo
                            </label>
                            <input type="text" id="editNome" required>
                        </div>

                        <div class="data-item-edit">
                            <label>
                                <i class="fa-solid fa-envelope"></i>
                                E-mail
                            </label>
                            <input type="email" id="editEmail" required>
                        </div>

                        <div class="data-item-edit">
                            <label>
                                <i class="fa-solid fa-phone"></i>
                                Telefone
                            </label>
                            <input type="text" id="editTelefone" required>
                        </div>

                        <div class="data-item-edit">
                            <label>
                                <i class="fa-solid fa-building"></i>
                                Empresa
                            </label>
                            <input type="text" id="editEmpresa" required>
                        </div>
                    </div>

                    <hr style="border: none; border-top: 1px solid #E5E7EB; width: 100%; margin-top: 30px;">

                    <div class="btn-wrapper">
                        <button type="submit" onclick="toggleEditMode()">
                            <i class="fa-solid fa-floppy-disk"></i>
                            Salvar
                        </button>
                        <button type="button" onclick="window.location.href='/login-usuario'">
                            <i class="fa-solid fa-arrow-left-long"></i>
                            Voltar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../login-usuario/js/editar-usuario.js"></script>
</body>

</html>

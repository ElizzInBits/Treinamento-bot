<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Empresas</title>
  <link rel="stylesheet" href="/empreCadastro/css/empre-style.css" />
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Cadastro de Empresa</h1>
      <p>Preencha os dados da empresa abaixo</p>
    </div>

    <div class="form-section">
      <h2><span>🏢</span> Formulário de Cadastro</h2>
      <form id="cadastroEmpresaForm">
        <div class="form-group">
          <label for="razaoSocial">Razão Social *</label>
          <input type="text" id="razaoSocial" name="razaoSocial" required placeholder="Digite a razão social da empresa" />
        </div>

        <div class="form-group">
          <label for="cnpj">CNPJ *</label>
          <input type="text" id="cnpj" name="cnpj" required placeholder="Ex: 12.345.678/0001-90" />
        </div>

        <div class="form-group">
          <label for="porte">Porte da Empresa *</label>
          <select id="porte" name="porte" required>
            <option value="">Selecione o porte</option>
            <option value="micro">Microempresa</option>
            <option value="pequeno">Pequeno Porte</option>
            <option value="medio">Médio Porte</option>
            <option value="grande">Grande Porte</option>
          </select>
        </div>

        <div class="form-group">
          <label for="endereco">Endereço *</label>
          <input type="text" id="endereco" name="endereco" required placeholder="Rua, número e complemento" />
        </div>

        <div class="form-group">
          <label for="cep">CEP *</label>
          <input type="text" id="cep" name="cep" required placeholder="Ex: 12345-678" />
        </div>

        <div class="form-group">
          <label for="contato">Número de Contato *</label>
          <div style="display: flex; gap: 10px;">
            <select id="ddi" name="ddi" required style="width: 120px;">
              <option value="+55">🇧🇷 +55</option>
              <option value="+1">🇺🇸 +1</option>
              <option value="+44">🇬🇧 +44</option>
              <option value="+33">🇫🇷 +33</option>
              <option value="+49">🇩🇪 +49</option>
              <option value="+34">🇪🇸 +34</option>
              <option value="+351">🇵🇹 +351</option>
              <option value="+52">🇲🇽 +52</option>
              <option value="+81">🇯🇵 +81</option>
              <option value="+91">🇮🇳 +91</option>
              <option value="+61">🇦🇺 +61</option>
              <option value="+1">🇨🇦 +1</option>
              <!-- Adicione outros DDIs conforme necessário -->
            </select>
            <input type="text" id="contato" name="contato" required placeholder="Ex: 11999990000" style="flex: 1;" />
          </div>
          <small style="color: #666; font-size: 12px;">Digite apenas números, sem parênteses ou traços</small>
        </div>

        <div class="form-group">
          <label for="email">Email *</label>
          <input type="email" id="email" name="email" required placeholder="exemplo@empresa.com" />
        </div>

        <button type="submit" class="btn-primary">
          <span>💾</span> Cadastrar Empresa
        </button>
      </form>
    </div>

    <!-- Seção de Gerenciamento de Treinamentos -->
    <div class="training-management-section" id="trainingSection" style="display: none;">
      <h2><span>🎓</span> Gerenciar Treinamentos</h2>
      
      <div class="training-container">
        <!-- Treinamentos Atribuídos -->
        <div class="training-column assigned-trainings">
          <h3>📝 Treinamentos Atribuídos</h3>
          <div class="training-list" id="assignedTrainingsList">
            <div class="loading">Carregando...</div>
          </div>
        </div>

        <!-- Treinamentos Disponíveis -->
        <div class="training-column available-trainings">
          <h3>➕ Treinamentos Disponíveis</h3>
          <div class="training-list" id="availableTrainingsList">
            <div class="loading">Carregando...</div>
          </div>
        </div>
      </div>
    </div>


  </div>

  <script src="/empreCadastro/js/empre-script.js" defer></script>
</body>
</html>

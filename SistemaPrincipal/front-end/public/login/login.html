<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Treinamentos</title>
    <link rel="icon" type="image/png" href="../home/Imagens/logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Onest:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <script src="https://kit.fontawesome.com/4392b60e4c.js" crossorigin="anonymous"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="login.css">
</head>

<body>
    <div class="login-container">
        <div class="login-box">
            <div class="logo">
                <img src="../home/Imagens/logo.png" alt="Logo" />
                <h1>Sistema de Treinamentos</h1>
            </div>

            <form id="loginForm">
                <div class="input-group">
                    <label for="username" class="text">Usuário:</label>
                    <input type="text" class="input" id="username" name="username" required>
                </div>

                <div class="input-group">
                    <label for="password" class="text">Senha:</label>
                    <input type="password" class="input" id="password" name="password" required>
                </div>

                <button type="submit" class="login-btn">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i>
                    Entrar
                </button>

                <div id="error-message" class="error-message" style="display: none;"></div>
            </form>
        </div>
    </div>

    <script src="login.js"></script>
</body>

</html>

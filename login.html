<!DOCTYPE html>
<html>
<head>
    <title>Admin Login</title>
</head>
<body>
    <h2>Login Admin</h2>
    <input type="text" id="user" placeholder="Usuário" value="Administrador">
    <input type="password" id="pass" placeholder="Senha">
    <button onclick="login()">Entrar</button>
    
    <div id="result"></div>
    
    <div id="api" style="display:none">
        <h3>API Access</h3>
        <input type="text" id="endpoint" placeholder="/api/empresas">
        <button onclick="getAPI()">Acessar</button>
        <pre id="data"></pre>
    </div>

    <script>
        let token = null;
        
        async function login() {
            const user = document.getElementById('user').value;
            const pass = document.getElementById('pass').value;
            
            const res = await fetch('http://72.60.48.249:3000/api/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: user, password: pass})
            });
            
            const data = await res.json();
            if(data.token) {
                token = data.token;
                document.getElementById('api').style.display = 'block';
                document.getElementById('result').innerHTML = 'Logado!';
            } else {
                document.getElementById('result').innerHTML = 'Erro: ' + data.message;
            }
        }
        
        async function getAPI() {
            const endpoint = document.getElementById('endpoint').value;
            
            const res = await fetch('http://72.60.48.249:3000' + endpoint, {
                headers: {'Authorization': 'Bearer ' + token}
            });
            
            const data = await res.json();
            document.getElementById('data').innerHTML = JSON.stringify(data, null, 2);
        }
    </script>
</body>
</html>
